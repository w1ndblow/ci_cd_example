.deploy_very_security:
  trigger:
    project: w1ndblow/example-pipelines
    strategy: depend
  variables:
    UPSTREAM_CI_COMMIT_SHORT_SHA: $CI_COMMIT_SHORT_SHA
    UPSTREAM_CI_COMMIT_TIMESTAMP: $CI_COMMIT_TIMESTAMP
    UPSTREAM_CI_COMMIT_BRANCH: $CI_COMMIT_BRANCH
    UPSTREAM_CI_PROJECT_NAME: $CI_PROJECT_NAME
    UPSTREAM_CI_PROJECT_ID: $CI_PROJECT_ID
    UPSTREAM_CI_PROJECT_PATH: $CI_PROJECT_PATH
    UPSTREAM_CI_PROJECT_PATH_SLUG: $CI_PROJECT_PATH_SLUG
    UPSTREAM_CI_PROJECT_URL: $CI_PROJECT_URL
    UPSTREAM_CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME
    UPSTREAM_CI_COMMIT_REF_PROTECTED: $CI_COMMIT_REF_PROTECTED
    UPSTREAM_CI_COMMIT_TAG: $CI_COMMIT_TAG
    UPSTREAM_CI_COMMIT_TITLE: $CI_COMMIT_TITLE
    UPSTREAM_CI_COMMIT_MESSAGE: $CI_COMMIT_MESSAGE
    UPSTREAM_CI_COMMIT_SHA: $CI_COMMIT_SHA
    UPSTREAM_CI_COMMIT_AUTHOR: $CI_COMMIT_AUTHOR
    UPSTREAM_CI_JOB_NAME: $CI_JOB_NAME
