.docker_settings:
  before_script:
    - mkdir -p  ~/.docker
    - >
      echo -n "{
        \"auths\": {
          \"$CI_REGISTRY\": {
            \"auth\": \"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64 -w 0)\"
          }
        }
      }" > ~/.docker/config.json


build2:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  extends:
    - .docker_settings
  script:
    - docker build . -t $CI_REGISTRY/w1ndblow/ci-cd-example:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY/w1ndblow/ci-cd-example:$CI_COMMIT_SHORT_SHA
